name: optionspread-heatmaps

services:
  optionspread:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: optionspread-heatmaps
    container_name: optionspread-heatmaps
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/app/data
      - reports:/app/reports

volumes:
  data:
  reports:
